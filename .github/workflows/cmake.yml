name: Vacuum-IM Build

on: [push]

jobs:
  build:
    name: ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: packages
      run: sudo apt update && sudo apt install build-essential cmake ninja-build pkg-config qt6-base-dev qt6-base-private-dev qt6-svg-dev qt6-multimedia-dev qt6-tools-dev qt6-tools-dev-tools libgl1-mesa-dev libx11-dev libxss-dev zlib1g-dev libidn-dev libhunspell-dev libssl-dev
    - name: cmake configure
      run: cmake -S . -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -DSPELLCHECKER_BACKEND=HUNSPELL
    - name: build
      run: cmake --build build --parallel 4
    - name: install
      run: sudo cmake --install build
