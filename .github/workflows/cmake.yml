name: Release archives

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archives-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (Arch, system libraries)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Prepare pinned Arch build environment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/containers/linux.Dockerfile
          tags: vacuum-linux:latest
          load: true
          cache-from: type=gha,scope=linux-toolchain
          cache-to: type=gha,scope=linux-toolchain,mode=max,ignore-error=true
      - name: Restore Linux compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ccache-linux
          key: linux-ccache-v1-${{ hashFiles('.github/containers/linux.Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-v1-${{ hashFiles('.github/containers/linux.Dockerfile') }}-
      - name: Build, package and check extracted archive
        run: |
          mkdir -p "$RUNNER_TEMP/ccache-linux"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/ccache-linux:/ccache" \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=1G \
            -e CCACHE_BASEDIR=/src -e CCACHE_COMPILERCHECK=content \
            -v "$GITHUB_WORKSPACE:/src" -w /src vacuum-linux bash -euc '
              ccache --zero-stats
              cmake --preset release -B build/linux -DVACUUM_DEPENDENCY_PROVIDER=SYSTEM \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
              cmake --build build/linux --parallel 4
              ccache --show-stats
              cpack --config build/linux/CPackConfig.cmake -C Release
              python .github/scripts/check_archive.py "build/linux/packages/*.tar.gz"
            '
      - uses: actions/upload-artifact@v7
        with:
          path: build/linux/packages/*.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x86_64 (Qt and GStreamer bundled)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: vacuum-windows-x64-v1
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4.5.0
        with:
          version: '6.12.0'
          # The released aqt 3.3.0 uses the repository layout from Qt <=6.10.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7'
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true
          cache-key-prefix: qt-windows-x64-v1
      - name: Restore GStreamer SDK
        id: gstreamer-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/gstreamer-sdk
          key: gstreamer-windows-2022-x64-v1-${{ hashFiles('.github/scripts/install-gstreamer.ps1') }}
      - name: Prepare pinned GStreamer runtime and development files
        run: ./.github/scripts/install-gstreamer.ps1 -UseCachedSdk:('${{ steps.gstreamer-cache.outputs.cache-hit }}' -eq 'true')
      - name: Save GStreamer SDK
        if: steps.gstreamer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/gstreamer-sdk
          key: ${{ steps.gstreamer-cache.outputs.cache-primary-key }}
      - name: Prepare Windows compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
      - name: Configure
        run: >-
          cmake --preset release -DVACUUM_DEPENDENCY_PROVIDER=BUNDLED
          -DBUNDLE_WINDOWS_DEPENDENCIES=ON "-DVACUUM_GSTREAMER_ROOT=$env:VACUUM_GSTREAMER_ROOT"
          "-DPKG_CONFIG_EXECUTABLE=$env:VACUUM_GSTREAMER_ROOT/bin/pkg-config.exe"
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build --preset release --parallel 4
      - name: Windows compiler cache statistics
        run: sccache --show-stats
      - name: Package
        run: cpack --config build/release/CPackConfig.cmake -C Release
      - name: Check extracted archive with SDKs hidden
        run: |
          python .github/scripts/check_archive.py "build/release/packages/*.zip" `
            --hide-sdk "$env:QT_ROOT_DIR" --hide-sdk "$env:VACUUM_GSTREAMER_ROOT"
      - uses: actions/upload-artifact@v7
        with:
          path: build/release/packages/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
